# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Compiles the GTK demo:
# g++ -I. $(pkg-config --cflags gtkmm-3.0 sigc++-2.0) main.cc -o main.elf ...
# scripts/build_gtk.py runs that (resolving the pkg-config flags at build time);
# the explicit processor keys it on main.cc and declares main.elf.
[processor.explicit.gtk]
command = "scripts/build_gtk.py"
inputs = ["main.cc"]
output_files = ["main.elf"]

# gtkmm 3 and its pkg-config metadata for the demo.
[dependencies]
system = [
    "libgtkmm-3.0-dev",
]
